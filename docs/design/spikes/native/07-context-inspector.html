<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zone — Quiet Inspector</title><style>
:root{color-scheme:light dark;--bg:#ececec;--window:#fafafa;--bar:#f2f2f2;--side:#ededed;--surface:#fff;--text:#242424;--muted:#777;--line:#dcdcdc;--accent:#1677df;--tint:#dcecff;--control:#fff;--pause:#a96313}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;min-height:100vh;padding:32px}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:6px;background:var(--control);padding:5px 11px;box-shadow:0 1px 2px #00000008}button:hover{filter:brightness(.96)}button:active{transform:translateY(1px)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:3px}button.primary{background:var(--accent);color:white;border-color:transparent;font-weight:500;padding:8px 23px}button.link,button.icon{border:0;background:transparent;color:var(--accent);box-shadow:none;padding:5px 7px}button.icon{color:var(--muted);font-size:17px;min-width:28px}button.danger{color:#c64343}.window{width:720px;height:540px;background:var(--window);border:1px solid #0003;border-radius:12px;box-shadow:0 22px 75px #0002;overflow:hidden;display:flex;flex-direction:column;position:relative}.traffic{display:flex;gap:8px;align-items:center;position:absolute;left:17px;top:21px}.traffic i{height:12px;width:12px;border-radius:50%;background:#ff6058;border:1px solid #0001}.traffic i:nth-child(2){background:#ffbd2e}.traffic i:nth-child(3){background:#28c840}.toolbar{height:54px;min-height:54px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:600;position:relative}.body{flex:1;min-height:0;overflow:auto}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:11px}.caption{font-size:12px;color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:27px;font-weight:600;letter-spacing:-.6px}h2{font-size:17px;font-weight:600}h3{font-size:13px;font-weight:600}p{line-height:1.5}.section-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.pad{padding:24px}.rule{height:1px;background:var(--line);margin:18px 0}.timer{text-align:center}.timer .status{font-size:12px;color:var(--muted);margin-bottom:15px}.time{font-size:70px;font-weight:200;letter-spacing:-2.5px;font-variant-numeric:tabular-nums;line-height:1.1}.until{font-size:12px;color:var(--muted);margin:13px 0 26px}.actions{display:flex;align-items:center;justify-content:center;gap:12px}.actions button{min-width:100px}.state-paused .status,.state-paused .time{color:var(--pause)}.duration{border:0;background:transparent;font-size:68px;font-weight:200;letter-spacing:-2px;width:116px;text-align:right;padding:0;outline-offset:6px;font-variant-numeric:tabular-nums;appearance:textfield}.duration::-webkit-inner-spin-button{display:none}.duration-unit{font-size:17px;color:var(--muted);align-self:flex-end;margin:0 0 12px 8px}.duration-row{display:flex;align-items:center;justify-content:center}.summary-button{display:flex;align-items:center;justify-content:space-between;border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:0;box-shadow:none;padding:13px 0;width:100%;text-align:left}.summary-button:last-child{border-bottom:0}.summary-button .chevron{color:var(--muted);font-size:17px}.summary-button .left{display:flex;flex-direction:column;gap:4px}.summary-button .label{font-weight:500}.summary-button .value{font-size:12px;color:var(--muted)}.bottom-nav{display:flex;border-top:1px solid var(--line);padding:10px 20px;justify-content:space-between;align-items:center}.bottom-nav button{font-size:12px}.foot-status{font-size:11px;color:var(--muted)}.sidebar{width:178px;background:var(--side);padding:20px 11px;flex-shrink:0;border-right:1px solid var(--line)}.sidebar .section-title{padding:0 9px;margin:0 0 8px}.sidebar button{border:0;background:transparent;text-align:left;width:100%;box-shadow:none;padding:8px 10px;margin:1px 0;display:flex;align-items:center;gap:8px}.sidebar button.selected{background:var(--tint);color:var(--accent);font-weight:500}.sidebar .spacer{height:28px}.split{display:flex;height:100%}.detail{flex:1;min-width:0;overflow:auto}.item{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);gap:12px}.item .copy{display:flex;flex-direction:column;gap:4px}.item:last-child{border-bottom:0}.item button{flex-shrink:0}.weekday{font-size:10px;color:var(--muted);font-weight:600}.list-row{border-bottom:1px solid var(--line);padding:12px 0;display:flex;align-items:center;gap:12px}.website-dot{width:27px;height:27px;border-radius:7px;background:var(--side);display:grid;place-items:center;color:var(--muted);font-size:15px}.list-row button{margin-left:auto}.navtabs{display:flex;gap:24px;justify-content:center;height:58px;align-items:center;border-bottom:1px solid var(--line);background:var(--bar)}.navtabs button{border:0;background:none;box-shadow:none;color:var(--muted);font-size:12px;padding:9px 7px;border-radius:5px;display:flex;flex-direction:column;gap:3px;align-items:center}.navtabs button.selected{color:var(--accent);background:var(--tint)}.tab-icon{font-size:19px}.modal-scrim{position:absolute;inset:0;background:#0003;display:grid;place-items:start center;padding:54px 20px 20px;z-index:10;backdrop-filter:blur(2px)}.sheet{width:390px;max-height:100%;border:1px solid #0002;border-radius:10px;background:var(--window);box-shadow:0 15px 35px #0003;overflow:auto}.sheet-head{padding:20px 22px 0;display:flex;align-items:center;justify-content:space-between}.sheet-content{padding:18px 22px}.sheet-footer{display:flex;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);gap:8px}.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0}.field+.field{border-top:1px solid var(--line)}.field label{line-height:1.5}.field input[type=number]{width:64px}.field input,.field select,.add-input{border:1px solid var(--line);background:var(--control);border-radius:5px;padding:6px 8px}.field select{max-width:160px}.add-row{display:flex;gap:8px;margin-top:15px}.add-input{min-width:0;flex:1}.sheet .small{line-height:1.5}.inline-summary{display:flex;justify-content:center;gap:7px;align-items:center;color:var(--muted);font-size:12px;margin:14px 0}.inline-summary button{font-size:12px}.help-line{line-height:1.5;font-size:12px;color:var(--muted);margin:8px 0 0}.route-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px}.route-head h2{font-size:22px}.compact .window{width:324px;height:430px;border-radius:14px}.compact .toolbar{height:48px;min-height:48px;justify-content:space-between;padding:0 17px;font-size:13px}.compact .traffic{display:none}.compact .time{font-size:52px}.compact .duration{font-size:56px;width:94px}.compact .duration-unit{font-size:14px;margin-bottom:8px}.compact .modal-scrim{padding:0;background:var(--window);backdrop-filter:none}.compact .sheet{width:100%;height:100%;max-height:100%;border:0;box-shadow:none;border-radius:0;display:flex;flex-direction:column}.compact .sheet-content{flex:1;overflow:auto}.compact .summary-button{padding:10px 0}.compact .sheet-head{padding-top:20px}.compact .bottom-nav{padding:9px 14px}.compact .until{margin:10px 0 20px}.compact .primary{padding:7px 18px}.prototype-note{width:720px;max-width:100%;margin:14px auto 0;font-size:11px;color:var(--muted);text-align:center;line-height:1.6}.compact .prototype-note{width:324px}.ring{border:5px solid var(--line);border-top-color:var(--accent);border-right-color:var(--accent);border-radius:50%;width:238px;height:238px;margin:auto;display:flex;align-items:center;justify-content:center}.ring .time{font-size:49px}.ring .duration{font-size:61px;width:103px}.ring .until{margin:8px 0 0}.ring .status{margin:0 0 10px}.state-paused .ring{border-top-color:var(--pause);border-right-color:var(--pause)}.ring .duration-unit{font-size:14px;margin-bottom:9px}.agenda-row{position:relative;margin-left:10px;padding:0 0 22px 25px;border-left:1px solid var(--line)}.agenda-row:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--muted);position:absolute;top:5px;left:-4px}.agenda-row.current:before{background:var(--accent);box-shadow:0 0 0 4px var(--tint)}.outline summary{padding:15px 0;cursor:pointer;font-weight:500}.outline details{border-bottom:1px solid var(--line)}.outline details .inner{padding:0 0 20px 18px}.inspector{border-left:1px solid var(--line);width:200px;background:var(--bar);padding:22px 18px;flex-shrink:0}.small-timer{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--surface);padding:20px;border:1px solid var(--line);border-radius:10px}.small-timer .time{font-size:36px}.small-timer .until{margin:8px 0 0;text-align:left}.small-timer .duration{font-size:40px;width:70px}.small-timer .duration-unit{font-size:13px;margin-bottom:8px}.notes-sidebar{width:217px;background:var(--window);border-right:1px solid var(--line);padding:19px 12px}.notes-sidebar button{border:0;box-shadow:none;display:block;width:100%;text-align:left;background:transparent;padding:15px 13px;border-radius:7px}.notes-sidebar button.selected{background:var(--tint)}.notes-sidebar .title{font-weight:600;display:block;margin-bottom:5px}.notes-sidebar .caption{line-height:1.45;display:block}.notes-sidebar .section-title{padding-left:13px;margin:0 0 10px}.notes-sidebar .separator{margin:20px 0;border-top:1px solid var(--line)}.readable{max-width:390px;margin:auto}.section-space{margin-top:27px}.subtle-row{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}.subtle-row button{font-size:12px}.state-label{font-size:11px;color:var(--muted);font-weight:400}.toggle{width:30px;height:18px;border-radius:12px;background:var(--line);border:0;padding:2px;display:flex;align-items:center;box-shadow:none}.toggle:after{content:'';width:14px;height:14px;border-radius:50%;background:white;box-shadow:0 1px 2px #0002}.toggle.on{background:var(--accent);justify-content:flex-end}.route-hint{font-size:11px;color:var(--muted);padding:15px 0}@media(prefers-color-scheme:dark){:root{--bg:#171717;--window:#252525;--bar:#2c2c2c;--side:#2d2d2d;--surface:#2c2c2c;--text:#ededed;--muted:#999;--line:#414141;--accent:#4297f4;--tint:#244264;--control:#3b3b3b;--pause:#e2a65d}.window{border-color:#ffffff20;box-shadow:0 24px 70px #0006}}@media(max-width:760px){body{padding:12px}.window{width:min(720px,calc(100vw - 24px));height:560px}.sidebar{width:144px}.notes-sidebar{width:175px}.inspector{width:175px}.pad{padding:20px}.prototype-note{width:100%}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,filter .15s}.sheet{animation:sheet-in .15s ease-out}@keyframes sheet-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}}
</style></head><body><main><div id="app" class="window"></div><p class="prototype-note">Quiet Inspector · Interactive exploration 07<br>Start, pause, resume, and edit the rows to explore. ⌘, opens session options.</p></main><script>
const config={"id": "07-context-inspector", "title": "Quiet Inspector", "windowTitle": "Focus", "rationale": "The timer has a quiet canvas; a standard contextual inspector reveals configuration only when needed.", "visibleActionCount": 4, "strength": "Lowest persistent visual density; strong separation between doing and configuring.", "tradeoff": "Inspector can feel excessive for three fields and requires more window width."};
const s={phase:'idle',minutes:25,remaining:1500,mode:'flexible',pauses:1,pauseMinutes:5,pausesLeft:1,pauseRemaining:300,domains:['youtube.com','reddit.com','x.com'],apps:['News'],schedules:[{name:'Deep Work',time:'09:00',end:'10:30',repeat:'Weekdays',on:true}],route:'focus',modal:null,list:'Distractions',inspector:false,run:null};
const $=q=>document.querySelector(q),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mode=()=>s.phase==='idle'?s.mode:s.run.mode;
const status=()=>s.phase==='idle'?'Ready to focus':s.phase==='paused'?'Paused':mode()==='locked'?'Locked session':'Focusing';
const summary=()=>`${s.domains.length} websites · ${s.apps.length} app${s.apps.length===1?'':'s'}`;
const options=()=>`${s.mode==='locked'?'Locked':'Flexible'} · ${s.pauses===0?'No pauses':s.pauses+' pause'+(s.pauses===1?'':'s')}`;
const clock=n=>`${Math.floor(n/60).toString().padStart(2,'0')}:${(n%60).toString().padStart(2,'0')}`;
const untilTime=()=>new Date(Date.now()+s.remaining*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const duration=()=>`<div class="duration-row"><input class="duration" aria-label="Session duration in minutes" type="number" min="1" max="1440" value="${s.minutes}" data-value="minutes"><span class="duration-unit">min</span></div>`;
const action=()=>s.phase==='idle'?`<button class="primary" data-action="start">Start Session</button>`:s.phase==='paused'?`<button class="primary" data-action="resume">Resume</button>`:`<button class="${config.id==='04-menu-panel'?'primary':''}" data-action="pause" ${s.pausesLeft<=0?'disabled':''}>Pause${config.id==='04-menu-panel'?'':' '+s.run.pauseMinutes+' min'}</button>`;
const end=()=>s.phase!=='idle'&&mode()==='flexible'?`<button class="link danger" data-action="end">End</button>`:'';
const until=()=>s.phase==='idle'?'A little space to do what matters.':s.phase==='paused'?`Resumes in <span data-pause-time>${clock(s.pauseRemaining)}</span> · Ends ${untilTime()}`:`Until ${untilTime()} · ${s.pausesLeft} pause${s.pausesLeft===1?'':'s'} left`;
const timer=(ring=false)=>`<div class="timer"><div class="${ring?'ring':''}"><div><div class="status">${status()}</div>${s.phase==='idle'?duration():`<div class="time" data-time>${clock(s.remaining)}</div>`}${ring?`<div class="until">${s.phase==='idle'?'Block Distractions':s.phase==='paused'?'Resumes automatically':'Until '+untilTime()}</div>`:''}</div></div>${!ring?`<div class="until">${until()}</div>`:`<div style="height:23px"></div>`}<div class="actions">${action()}${end()}</div></div>`;
const row=(name,value,modal)=>`<button class="summary-button" data-modal="${modal}"><span class="left"><span class="label">${esc(name)}</span><span class="value">${esc(value)}</span></span><span class="chevron" aria-hidden="true">›</span></button>`;
const nav=()=>`<aside class="sidebar"><div class="section-title">Zone</div>${[['focus','◷','Focus'],['blocks','⊘','Block Lists'],['schedules','▦','Schedules']].map(([id,icon,label])=>`<button class="${s.route===id?'selected':''}" data-route="${id}"><span aria-hidden="true">${icon}</span>${label}</button>`).join('')}<div class="spacer"></div><div class="section-title">Block Lists</div><button data-modal="blocks">◉ &nbsp;${esc(s.list)}</button></aside>`;
const footer=()=>`<div class="bottom-nav"><span class="foot-status">${s.phase==='idle'?'Next: Deep Work · Monday at 9:00':'Blocking '+summary()}</span><button class="link" data-modal="schedules">Schedules</button></div>`;
const scheduleRows=()=>s.schedules.map((x,i)=>`<div class="item"><div class="copy"><strong>${esc(x.name)}</strong><span class="caption">${esc(x.repeat)} · ${x.time}–${x.end}</span></div><button class="toggle ${x.on?'on':''}" role="switch" aria-checked="${x.on}" aria-label="${x.on?'Disable':'Enable'} ${esc(x.name)}" data-toggle-schedule="${i}"></button></div>`).join('');
const blockRows=()=>s.domains.map((d,i)=>`<div class="list-row"><span class="website-dot" aria-hidden="true">◎</span><span>${esc(d)}</span><button class="icon" aria-label="Remove ${esc(d)}" data-remove-domain="${i}">−</button></div>`).join('')+s.apps.map((a,i)=>`<div class="list-row"><span class="website-dot" aria-hidden="true">▣</span><span>${esc(a)}</span><button class="icon" aria-label="Remove ${esc(a)}" data-remove-app="${i}">−</button></div>`).join('');
const blocksPage=()=>`<div class="pad readable"><div class="route-head"><h2>Block Lists</h2><button class="icon" aria-label="Edit block list" data-modal="blocks">✎</button></div><h3>${esc(s.list)}</h3><p class="help-line">Unavailable while your session is running.</p>${blockRows()}<div class="subtle-row"><span>Websites and apps</span><button class="link" data-modal="blocks">Edit List…</button></div></div>`;
const schedulesPage=()=>`<div class="pad readable"><div class="route-head"><h2>Schedules</h2><button class="icon" aria-label="New schedule" data-modal="schedule-new">＋</button></div><p class="caption">A little structure, built into your week.</p><div class="section-space">${scheduleRows()}</div><p class="route-hint">Sessions start automatically while Zone is running.</p></div>`;
const otherPage=()=>s.route==='blocks'?blocksPage():schedulesPage();
function view(){
if(config.id==='01-clock-face')return`<div class="body pad"><div style="max-width:350px;margin:8px auto 0">${timer(true)}<div class="inline-summary"><button class="link" data-modal="blocks">${esc(s.list)}</button><span>·</span><button class="link" data-modal="options">${options()}</button></div></div></div><div class="bottom-nav"><button class="link" data-modal="blocks">Block Lists</button><span class="foot-status">Next: Deep Work · Monday at 9:00</span><button class="link" data-modal="schedules">Schedules</button></div>`;
if(config.id==='02-reminders-lists')return`<div class="body split">${nav()}<main class="detail">${s.route==='focus'?`<div class="pad"><div class="row between"><h1>${esc(s.list)}</h1><button class="icon" aria-label="Edit list" data-modal="blocks">ⓘ</button></div><p class="help-line">${summary()} stay out of the way.</p><div style="margin:42px 0 22px">${timer()}</div><div class="rule"></div><div class="subtle-row"><span>${options()}</span><button class="link" data-modal="options">Options…</button></div></div>`:otherPage()}</main></div>`;
if(config.id==='03-notes-plan')return`<div class="body split"><aside class="notes-sidebar"><div class="section-title">Sessions</div><button class="${s.route==='focus'?'selected':''}" data-route="focus"><span class="title">Right Now</span><span class="caption">${s.phase==='idle'?'A session on your terms.':status()+' · '+clock(s.remaining)}</span></button><button class="${s.route==='schedules'?'selected':''}" data-route="schedules"><span class="title">Deep Work</span><span class="caption">Weekdays · 9:00–10:30<br>Distractions</span></button><div class="separator"></div><button data-modal="schedule-new"><span class="caption">＋ Schedule a Session…</span></button></aside><main class="detail">${s.route==='focus'?`<div class="pad"><div class="row between"><h2>Right Now</h2><button class="icon" aria-label="Session options" data-modal="options">•••</button></div><div style="margin-top:49px">${timer()}</div><div style="margin:26px 16px 0">${row('Blocking '+s.list,summary(),'blocks')}</div></div>`:otherPage()}</main></div>`;
if(config.id==='04-menu-panel')return`<div class="body" style="padding:26px 22px 12px">${timer()}<div style="margin-top:24px">${row(s.list,summary(),'blocks')}${row(s.mode==='locked'?'Locked Session':'Flexible Session',s.pauses===0?'No pauses':s.pauses+' pause · '+s.pauseMinutes+' minutes','options')}</div></div><div class="bottom-nav"><button class="link" data-modal="schedules">Schedules</button><span class="foot-status">${s.phase==='idle'?'Ready':s.phase==='paused'?'Blocking is paused':'Blocking is on'}</span></div>`;
if(config.id==='05-today-agenda')return`<div class="body pad" style="padding:28px 44px"><div class="row between"><div><div class="caption">Saturday, October 17</div><h1 style="margin-top:4px">Today</h1></div><button class="icon" aria-label="Schedule a session" data-modal="schedule-new">＋</button></div><div style="margin-top:29px"><div class="agenda-row current"><div class="row between" style="margin-bottom:13px"><h3>${s.phase==='idle'?'A little time for yourself':status()}</h3><button class="link" data-modal="options">${s.mode==='locked'?'Locked':'Flexible'}⌄</button></div><div class="small-timer"><div>${s.phase==='idle'?duration():`<div class="time" data-time>${clock(s.remaining)}</div>`}<div class="until caption">${s.phase==='idle'?'Blocking '+s.list:until()}</div></div><div class="row">${action()}${end()}</div></div><div class="subtle-row"><button class="link" data-modal="blocks">${esc(s.list)} · ${summary()}</button></div></div><div class="agenda-row"><div class="weekday">MONDAY</div><div class="row between" style="margin-top:7px"><div><h3>Deep Work</h3><p class="help-line">9:00–10:30 · Weekdays</p></div><button class="link" data-modal="schedules">View</button></div></div></div></div>`;
if(config.id==='06-unified-outline')return`<div class="body pad" style="padding:28px 50px"><div class="row between"><h1>Focus</h1><span class="caption">${status()}</span></div><div class="small-timer" style="margin:26px 0 13px"><div>${s.phase==='idle'?duration():`<div class="time" data-time>${clock(s.remaining)}</div>`}<div class="until caption">${s.phase==='idle'?'A session starts when you do.':until()}</div></div><div class="row">${action()}${end()}</div></div><div class="outline"><details><summary>Blocking ${esc(s.list)} <span class="caption">· ${summary()}</span></summary><div class="inner">${s.domains.map(d=>`<div class="caption" style="margin:8px 0">${esc(d)}</div>`).join('')}<button class="link" data-modal="blocks">Edit Block List…</button></div></details><details><summary>${options()}</summary><div class="inner"><p class="caption">${s.mode==='locked'?'This session can’t end early.':'End early when you need to.'} ${s.pauses} pause, ${s.pauseMinutes} minutes.</p><button class="link" data-modal="options">Session Options…</button></div></details><details><summary>Schedule <span class="caption">· Deep Work Monday, 9:00</span></summary><div class="inner">${scheduleRows()}<button class="link" data-modal="schedule-new">Add Schedule…</button></div></details></div></div>`;
if(config.id==='07-context-inspector')return`<div class="body split"><main class="detail pad"><div style="margin-top:29px">${timer(true)}</div><div class="inline-summary"><span>${esc(s.list)}</span><span>·</span><span>${mode()==='locked'?'Locked':'Flexible'}</span></div><div class="row" style="justify-content:center"><button class="link" data-action="inspector">${s.inspector?'Hide Details':'Session Details…'}</button></div></main>${s.inspector?`<aside class="inspector"><h3>Session Details</h3><div style="margin-top:17px">${row('Block List',s.list,'blocks')}${row('Mode',s.mode==='locked'?'Locked':'Flexible','options')}${row('Pauses',s.pauses+' · '+s.pauseMinutes+' minutes each','options')}</div><div class="rule"></div><button class="link" data-modal="schedules">Schedules</button></aside>`:''}</div>${footer()}`;
if(config.id==='08-toolbar-tabs')return`<nav class="navtabs" aria-label="Views">${[['focus','◷','Focus'],['schedules','▦','Schedules'],['blocks','⊘','Block Lists']].map(([id,icon,label])=>`<button data-route="${id}" class="${s.route===id?'selected':''}"><span class="tab-icon" aria-hidden="true">${icon}</span>${label}</button>`).join('')}</nav><div class="body">${s.route==='focus'?`<div class="pad readable"><div style="margin-top:28px">${timer()}</div><div style="margin-top:23px">${row(s.list,summary(),'blocks')}${row('Session Options',options(),'options')}</div></div>`:otherPage()}</div>`;
}
function modal(){let title='',body='',foot='<button class="primary" data-action="close">Done</button>';
if(s.modal==='blocks'){title=s.list;body=`<p class="caption">These websites and apps stay blocked during a session.</p>${blockRows()}<div class="add-row"><input class="add-input" id="new-domain" placeholder="Website, e.g. example.com" aria-label="Website"><button data-action="add-domain">Add</button></div><p class="small muted" style="margin-top:12px">Changes apply to your next session.</p>`}
if(s.modal==='options'){title='Session Options';body=`<div class="field"><label for="mode">Mode</label><select id="mode" data-value="mode"><option value="flexible" ${s.mode==='flexible'?'selected':''}>Flexible</option><option value="locked" ${s.mode==='locked'?'selected':''}>Locked</option></select></div><p class="help-line">${s.mode==='locked'?'Runs until the end. Only the pauses you allow are available.':'End a session early when you need to.'}</p><div class="rule"></div><div class="field"><label for="pauses">Pauses allowed</label><input id="pauses" type="number" min="0" max="20" value="${s.pauses}" data-value="pauses"></div><div class="field"><label for="pause-minutes">Each pause</label><div class="row"><input id="pause-minutes" type="number" min="1" max="60" value="${s.pauseMinutes}" data-value="pauseMinutes"><span class="caption">min</span></div></div><p class="small muted" style="margin-top:15px">${s.phase==='idle'?'These options apply when you start.':'Your running session keeps its original rules. Changes apply to the next session.'}</p>`}
if(s.modal==='schedules'){title='Schedules';body=`${scheduleRows()}<p class="help-line">Sessions start automatically while Zone is running.</p>`;foot=`<button class="link" data-modal="schedule-new">Add Schedule…</button><button class="primary" data-action="close">Done</button>`}
if(s.modal==='schedule-new'){title='New Schedule';body=`<div class="field"><label for="schedule-name">Name</label><input id="schedule-name" value="Deep Work" style="width:180px"></div><div class="field"><label for="schedule-repeat">Repeat</label><select id="schedule-repeat"><option>Weekdays</option><option>Every Day</option><option>Once</option></select></div><div class="field"><label for="schedule-start">From</label><input id="schedule-start" type="time" value="09:00"></div><div class="field"><label for="schedule-end">Until</label><input id="schedule-end" type="time" value="10:30"></div><div class="field"><span>Block list</span><span class="muted">${esc(s.list)}</span></div><p class="small muted">${options()}. Uses your current pause settings.</p>`;foot='<button data-modal="schedules">Cancel</button><button class="primary" data-action="save-schedule">Add Schedule</button>'}
if(s.modal==='confirm'){title='Start a locked session?';body=`<p>You won’t be able to end this ${s.minutes}-minute session early. ${s.pauses?'You can use '+s.pauses+' pause'+(s.pauses===1?'':'s')+' of '+s.pauseMinutes+' minutes.':'No pauses will be available.'}</p>`;foot='<button data-action="close">Cancel</button><button class="primary" data-action="start-confirmed">Start Session</button>'}
return `<div class="modal-scrim"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title">${esc(title)}</h2></div><div class="sheet-content">${body}</div><div class="sheet-footer">${foot}</div></section></div>`}
function render(){document.body.classList.toggle('compact',config.id==='04-menu-panel');$('#app').className='window state-'+s.phase;$('#app').innerHTML=`<header class="toolbar">${config.id==='04-menu-panel'?'<span>Zone</span><span class="state-label">'+status()+'</span>':'<span class="traffic" aria-hidden="true"><i></i><i></i><i></i></span><span>'+config.windowTitle+'</span>'}</header>${view()}${s.modal?modal():''}`;if(s.modal)setTimeout(()=>$('.sheet button, .sheet input, .sheet select')?.focus(),0)}
function start(){s.phase='active';s.remaining=s.minutes*60;s.pausesLeft=s.pauses;s.run={mode:s.mode,pauseMinutes:s.pauseMinutes,domains:[...s.domains],apps:[...s.apps]};s.modal=null;render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.modal){s.modal=b.dataset.modal;render();return}if(b.dataset.route){s.route=b.dataset.route;render();return}if(b.hasAttribute('data-remove-domain')){s.domains.splice(Number(b.dataset.removeDomain),1);render();return}if(b.hasAttribute('data-remove-app')){s.apps.splice(Number(b.dataset.removeApp),1);render();return}if(b.hasAttribute('data-toggle-schedule')){s.schedules[Number(b.dataset.toggleSchedule)].on=!s.schedules[Number(b.dataset.toggleSchedule)].on;render();return}switch(b.dataset.action){case 'start':if(s.mode==='locked'){s.modal='confirm';render()}else start();break;case 'start-confirmed':start();break;case 'pause':if(s.pausesLeft){s.phase='paused';s.pausesLeft--;s.pauseRemaining=s.run.pauseMinutes*60;render()}break;case 'resume':s.phase='active';render();break;case 'end':if(s.run.mode==='flexible'){s.phase='idle';render()}break;case 'close':s.modal=null;render();break;case 'inspector':s.inspector=!s.inspector;render();break;case 'add-domain':{const input=$('#new-domain');let value=input.value.trim().replace(/^https?:\/\//,'').split('/')[0];if(value&&!s.domains.includes(value)){s.domains.push(value);render()}break}case 'save-schedule':{const name=$('#schedule-name').value.trim(),time=$('#schedule-start').value,end=$('#schedule-end').value,repeat=$('#schedule-repeat').value;if(name&&time&&end&&time!==end){s.schedules.push({name,time,end,repeat,on:true});s.modal='schedules';render()}break}}});
document.addEventListener('change',e=>{const key=e.target.dataset.value;if(!key)return;if(key==='mode')s.mode=e.target.value;else{const n=Number(e.target.value),lo=Number(e.target.min),hi=Number(e.target.max);s[key]=Math.max(lo,Math.min(hi,Number.isFinite(n)?Math.round(n):lo))}render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.modal){s.modal=null;render()}if(e.key==='Enter'&&e.target.id==='new-domain')document.querySelector('[data-action="add-domain"]')?.click();if((e.metaKey||e.ctrlKey)&&e.key===','){e.preventDefault();s.modal='options';render()}});
setInterval(()=>{if(s.phase==='idle')return;s.remaining=Math.max(0,s.remaining-1);if(s.phase==='paused'){s.pauseRemaining=Math.max(0,s.pauseRemaining-1);if(s.pauseRemaining===0){s.phase='active';render()}}if(s.remaining===0){s.phase='idle';render();return}document.querySelectorAll('[data-time]').forEach(e=>e.textContent=clock(s.remaining));document.querySelectorAll('[data-pause-time]').forEach(e=>e.textContent=clock(s.pauseRemaining))},1000);render();
</script></body></html>
