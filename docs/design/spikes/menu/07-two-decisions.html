<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Zone · Two decisions</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252528}body{background:#e9e9ed;display:grid;place-items:center;min-height:100vh;padding:18px;font-size:13px}.app{width:320px;max-width:100%;min-height:350px;background:rgba(250,250,252,.98);border:1px solid #00000015;border-radius:13px;box-shadow:0 16px 50px #1b1d3424,0 1px 3px #0001;overflow:hidden}header{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #0000000c}.brand{font-weight:650;font-size:13px}.state{font-size:11px;color:#74747d}main{padding:20px}h1,h2,p{margin:0}h1{font-size:22px;font-weight:650;letter-spacing:-.5px}h2{font-size:16px}.subtle{color:#777781}.caption{font-size:11px;line-height:1.4}.center{text-align:center}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:flex;flex-direction:column;gap:12px}.spaced{margin-top:20px}.primary{border:0;background:#087cf0;color:white;font-weight:600;box-shadow:0 1px 2px #0001;border-radius:7px;padding:10px 15px;width:100%;font-size:13px}.primary:hover{background:#006cde}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.45;cursor:default}.plain{background:none;border:0;padding:4px 0;color:#5b5b65;text-align:left}.link{color:#0874df;background:none;border:0;padding:4px 0;font-size:12px}.icon{border:0;background:transparent;padding:5px 7px;font-size:17px;line-height:1;color:#777782;border-radius:5px}.icon:hover{background:#00000009}select{border:1px solid #00000019;border-radius:5px;background:#fff;padding:4px 6px;color:#3c3c44;max-width:180px}input[type=number]{border:1px solid #0002;background:#fff;border-radius:5px;padding:5px;max-width:65px}input[type=range]{width:100%;accent-color:#087cf0}input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #087cf066;outline-offset:3px}.field{display:flex;align-items:center;justify-content:space-between;gap:15px;font-size:12px;padding:8px 0}.divider{height:1px;background:#0000000d;margin:15px 0}.footer{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-top:1px solid #0000000c;min-height:39px}.footer button{font-size:11px}.footer .statusdot{font-size:11px;color:#777}.details{background:#f0f0f4;border-radius:8px;padding:11px;margin-top:14px}.details summary{cursor:pointer;font-size:12px;color:#666671;user-select:none}.details p{margin:8px 0;font-size:11px;line-height:1.5;color:#777}.active-number{font-size:58px;font-weight:250;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin:24px 0 6px;line-height:1}.active-label{font-size:12px;color:#777}.progress{height:4px;border-radius:3px;background:#dddde5;margin:22px 0;overflow:hidden}.progress div{height:100%;background:#0780ee;transition:width 1s linear}.pause-note{font-size:11px;color:#777;margin:10px 0 20px}.end-row{text-align:center;margin-top:8px;min-height:25px}.end-row button{font-size:11px;color:#777}.configuration{padding-top:3px}.configuration .caption{margin-top:8px}.back{display:flex;align-items:center;gap:5px;border:0;background:transparent;color:#1676df;padding:0;font-size:12px}.panel-title{margin:16px 0 12px}.settings-actions{margin-top:15px;display:flex;justify-content:space-between;gap:12px}.settings-actions button{flex:1}.secondary{border:1px solid #0002;background:#fff;border-radius:6px;padding:8px 12px}.warning{border-left:2px solid #d9a53b;padding-left:12px;margin:16px 0;font-size:12px;line-height:1.5;color:#69635b}.outline-list{list-style:none;padding:0;margin:14px 0;border:1px solid #0001;border-radius:8px;overflow:hidden}.outline-list li{padding:10px 12px;background:white;border-bottom:1px solid #0000000c;display:flex;justify-content:space-between;align-items:center}.outline-list li:last-child{border-bottom:0}.notice{margin-top:14px;background:#e9f1fb;color:#4b647e;padding:10px;border-radius:6px;font-size:11px;line-height:1.5}.screen-title{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:#8b8b94;margin-bottom:12px}button.segment{flex:1;border:0;background:none;border-radius:4px;padding:5px;font-size:12px}.segments{display:flex;background:#e8e8ec;padding:2px;border-radius:6px}.segments button.selected{background:#fff;box-shadow:0 1px 3px #0002;color:#202028}.locked-note{color:#7a7a84;font-size:11px;text-align:center;margin-top:13px}.badge{display:inline-flex;gap:4px;align-items:center;background:#efeff4;color:#777;border-radius:20px;padding:4px 8px;font-size:10px}.countdown-ring{position:relative;width:170px;height:170px;margin:12px auto 18px}.countdown-ring svg{width:100%;height:100%;transform:rotate(-90deg)}.countdown-ring circle{fill:none;stroke-width:3}.countdown-ring .ringlabel{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center}.countdown-ring .active-number{font-size:42px;margin:0}.countdown-ring .active-label{margin-top:6px}.small-readout{display:flex;align-items:center;justify-content:space-between;background:#efeff4;border-radius:8px;padding:12px;margin-bottom:16px}.small-readout strong{font-size:29px;font-weight:350;font-variant-numeric:tabular-nums}.mini-label{font-size:11px;color:#777}.time-input{appearance:textfield}.time-input::-webkit-inner-spin-button{appearance:none}.timeline-track{height:38px;position:relative;border-radius:7px;background:repeating-linear-gradient(90deg,transparent 0,transparent 23px,#0000000b 24px,#0000000b 25px),#efeff4;overflow:hidden;margin:17px 0 8px}.timeline-fill{height:100%;width:65%;background:#d8e8fa;border-left:3px solid #177adf}.timeline-track input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:ew-resize}.next-session{font-size:11px;line-height:1.6;color:#777;margin-top:18px}.fake-menu{padding:4px 0}.fake-menu button{display:block;width:100%;padding:8px 11px;border:0;background:none;text-align:left;font-size:12px;border-radius:5px}.fake-menu button:hover{background:#167ce8;color:white}.management-links{display:flex;gap:16px;margin-top:15px}.confirmation h2{margin-top:20px}.confirmation p{color:#777;line-height:1.5;margin-top:8px;font-size:12px}.completion{padding:30px 0;text-align:center}.completion .mark{font-size:32px;color:#56866a;margin-bottom:12px}.completion p{line-height:1.5;color:#777;font-size:12px;margin:10px 0 20px}@media(max-width:370px){body{padding:0;align-items:start;background:#fafafc}.app{width:100%;border:0;border-radius:0;box-shadow:none}main{padding:18px}.app{min-height:100vh}}@media(prefers-color-scheme:dark){body{background:#17171b;color:#ececf0}.app{background:#29292e;border-color:#ffffff12}header,.footer{border-color:#ffffff0b}.subtle,.state,.caption,.active-label,.pause-note,.locked-note,.mini-label,.next-session,.details p{color:#a3a3ad}select,input[type=number],.secondary,.outline-list li{background:#3b3b42;color:#efeff2;border-color:#ffffff14}.details,.badge,.small-readout{background:#33333b}.divider{background:#ffffff10}.plain,.end-row button{color:#b3b3bd}.segments{background:#1e1e24}.segments button.selected{background:#565660;color:#fff}.progress{background:#44444f}.timeline-track{background:repeating-linear-gradient(90deg,transparent 0,transparent 23px,#ffffff0b 24px,#ffffff0b 25px),#33333b}.timeline-fill{background:#25496c}.notice{background:#2b4056;color:#c3d6ea}.outline-list{border-color:#ffffff14}.outline-list li{border-color:#ffffff0c}}

.wizard-duration{display:flex;align-items:baseline;justify-content:center;gap:10px;padding:32px 0}.wizard-duration input{font-size:56px;font-weight:260;background:none!important;border:0!important;max-width:125px!important;width:125px;letter-spacing:-2px;text-align:center}.wizard-duration span{color:#888;font-size:12px}.review-card{padding:14px;background:#efeff4;border-radius:8px;margin:18px 0}.review-card strong{font-size:28px;font-weight:350}.review-card p{font-size:11px;color:#777;margin-top:3px}@media(prefers-color-scheme:dark){.review-card{background:#33333b}}</style></head><body><section class="app" aria-label="Zone menu bar prototype"><header><span class="brand">Zone</span><span class="state" role="status">Ready</span></header><main></main><footer class="footer"><span class="statusdot" data-footer-status>Browsers connected</span><button class="plain" data-action="manage">Manage Zone ›</button></footer></section><script>
const config={"id": "menu-07", "idle": "<p class=\"screen-title\">1 of 2 · Your time</p><h1>How long?</h1><p class=\"subtle caption\" style=\"margin-top:6px\">Give your attention some room.</p><div class=\"wizard-duration\"><input class=\"time-input\" type=\"number\" min=\"1\" max=\"1440\" value=\"{{minutes}}\" aria-label=\"Focus duration in minutes\" data-minutes><span>minutes</span></div><button class=\"primary\" data-action=\"review\">Continue</button><p class=\"caption subtle center\" style=\"margin-top:12px\">Next: choose what to block.</p>", "active": "quiet"};
const state={minutes:25,list:'Distractions',mode:'Flexible',allowance:1,pauseMinutes:5,phase:'idle',screen:'main',remaining:1500,pausesUsed:0,pauseRemaining:0,recipe:'short',endConfirm:false,startedAt:0};
const lists={'Distractions':'6 websites · 2 apps','Social media':'4 websites','Everything else':'12 websites · 3 apps'};
const root=document.querySelector('main');
const listPicker=()=>`<select id="list" aria-label="Block list" data-list>${Object.keys(lists).map(x=>`<option ${x===state.list?'selected':''}>${x}</option>`).join('')}</select>`;
const modeText=()=>state.mode==='Locked'?'Locked':'Flexible';
const pauseSummary=()=>state.allowance===0?'No pauses':`${state.allowance} ${state.allowance===1?'pause':'pauses'} · ${state.pauseMinutes} min each`;
const summary=()=>`${modeText()} · ${state.allowance===0?'No pauses':state.allowance+' '+(state.allowance===1?'pause':'pauses')}`;
const timeString=s=>`${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`;
const endTime=()=>new Date(Date.now()+state.minutes*60000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function fields(){return `<div class="configuration"><div class="field"><label for="duration">Duration</label><span><input id="duration" type="number" min="1" max="1440" value="${state.minutes}" aria-label="Duration in minutes" data-minutes> min</span></div><div class="field"><label for="list">Block list</label>${listPicker()}</div><div class="divider"></div><div class="field"><label for="mode">Session mode</label><select id="mode" data-setting="mode"><option ${state.mode==='Flexible'?'selected':''}>Flexible</option><option ${state.mode==='Locked'?'selected':''}>Locked</option></select></div><p class="caption subtle">${state.mode==='Locked'?'You cannot end a locked session early. Your configured pauses are still available.':'You can pause or end a flexible session at any time.'}</p><div class="field"><label for="allowance">Pauses allowed</label><select id="allowance" data-setting="allowance">${[0,1,2,3].map(x=>`<option value="${x}" ${state.allowance===x?'selected':''}>${x===0?'None':x}</option>`).join('')}</select></div><div class="field"><label for="pauseMinutes">Pause length</label><select id="pauseMinutes" data-setting="pauseMinutes" ${state.allowance===0?'disabled':''}>${[1,3,5,10,15].map(x=>`<option value="${x}" ${state.pauseMinutes===x?'selected':''}>${x} min</option>`).join('')}</select></div></div>`}
function interpolate(t){const v={minutes:state.minutes,list:listPicker(),listName:state.list,mode:modeText(),summary:summary(),pauseSummary:pauseSummary(),endTime:endTime(),rangePercent:Math.max(8,state.minutes/120*100),durationRows:[25,45,60,90].map(n=>`<button class="duration-choice ${state.minutes===n?'chosen':''}" data-duration="${n}"><span>${n} minutes</span><span>${state.minutes===n?'✓':''}</span></button>`).join(''),shortSelected:state.recipe==='short'?'selected':'',deepSelected:state.recipe==='deep'?'selected':'',shortCheck:state.recipe==='short'?'✓':'',deepCheck:state.recipe==='deep'?'✓':''};return t.replace(/{{(\w+)}}/g,(_,k)=>v[k]??'')}
function activeHTML(){const paused=state.phase==='paused';const mainTime=paused?state.pauseRemaining:state.remaining;const label=paused?'Pause remaining':'Time remaining';const fraction=100*(state.remaining/(state.minutes*60));const labelText=paused?`Resumes automatically · ${timeString(state.remaining)} left in session`:lists[state.list];const primary=paused?'Resume Focus':`Pause for ${state.pauseMinutes} min`;const canPause=paused||state.pausesUsed<state.allowance;const controls=`<button class="primary" data-action="${paused?'resume':'pause'}" ${canPause?'':'disabled'}>${canPause?primary:'No Pauses Remaining'}</button><div class="end-row">${state.mode==='Flexible'?'<button class="plain" data-action="end">End Session</button>':'<span class="locked-note">▣ Locked until this session ends</span>'}</div>`;const counter=`<div class="active-number" data-time>${timeString(mainTime)}</div><p class="active-label">${label}</p>`;const pauseInfo=`<p class="pause-note">${state.allowance===0?'No pauses configured':`${Math.max(0,state.allowance-state.pausesUsed)} ${state.allowance-state.pausesUsed===1?'pause':'pauses'} remaining`}</p>`;const progress=`<div class="progress"><div data-progress style="width:${fraction}%"></div></div>`;
if(config.active==='ring')return `<div class="row"><h2>${paused?'Taking a pause':'You’re in focus'}</h2><span class="badge">${state.mode}</span></div><div class="countdown-ring"><svg viewBox="0 0 170 170" aria-hidden="true"><circle cx="85" cy="85" r="78" stroke="#dddde5"/><circle data-ring cx="85" cy="85" r="78" stroke="${paused?'#c08c36':'#087cf0'}" stroke-dasharray="${fraction*4.9} 490"/></svg><div class="ringlabel">${counter}</div></div><div class="center"><p class="caption subtle">${state.list} · ${paused?'Blocking paused':'Blocking active'}</p>${pauseInfo}</div>${controls}`;
if(config.active==='menu')return `<div class="menu-active"><div class="row"><h2>${paused?'Paused':'Focusing'}</h2><span class="badge">${state.mode}</span></div><div class="row" style="margin-top:25px"><div class="active-number" data-time>${timeString(mainTime)}</div><span class="subtle caption">${label}</span></div><p class="caption subtle">${state.list} · ${lists[state.list]}</p>${progress}<p class="caption subtle">${labelText}</p>${pauseInfo}${controls}</div>`;
if(config.active==='sentence')return `<div class="sentence" style="margin-bottom:0">${paused?'Take a breath.':'You have'}<div class="active-number" data-time>${timeString(mainTime)}</div><span style="font-size:19px">${paused?'until focus resumes.':'to make progress.'}</span></div>${progress}<p class="caption subtle">${state.list} · ${paused?'Blocking paused':'Blocking active'}</p>${pauseInfo}${controls}`;
if(config.active==='timeline')return `<div class="row"><h2>${paused?'A brief pause':'Time for yourself'}</h2><span class="badge">${state.mode}</span></div><div class="center">${counter}</div>${progress}<div class="row caption subtle"><span>${paused?'Paused':'Started'}</span><span>${paused?'Will resume automatically':'Ends '+new Date(state.startedAt+state.minutes*60000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</span></div><div class="spaced"><p class="caption subtle">${state.list} · ${paused?'Blocking paused':'Blocking active'}</p>${pauseInfo}${controls}</div>`;
return `<div class="row"><h2>${paused?'Taking a pause':'You’re in focus'}</h2><span class="badge">${state.mode}</span></div><div class="center">${counter}<p class="caption subtle" style="margin-top:18px">${state.list} · ${paused?'Blocking paused':'Blocking active'}</p>${progress}${pauseInfo}</div>${controls}`;
}
function render(){document.querySelector('.state').textContent=state.phase==='idle'?'Ready':state.phase==='paused'?'Paused':state.phase==='complete'?'Complete':'Focusing';document.querySelector('[data-footer-status]').textContent=state.phase==='idle'?'Browsers connected':state.phase==='paused'?'Blocks temporarily lifted':state.phase==='complete'?'Blocks lifted':'Blocking active';
if(state.screen==='options'){root.innerHTML=`<button class="back" data-action="back">‹ Back</button><h2 class="panel-title">Session Options</h2>${fields()}<div class="settings-actions"><button class="primary" data-action="back">Done</button></div>`;return}
if(state.screen==='manage'){root.innerHTML=`<button class="back" data-action="back">‹ Back</button><h2 class="panel-title">Manage Zone</h2><div class="fake-menu"><button data-action="lists">Block Lists <span style="float:right">›</span></button><button data-action="schedules">Schedules <span style="float:right">›</span></button><button data-action="preferences">Settings <span style="float:right">›</span></button></div><div class="notice">The shipping app opens these destinations in its main window. This prototype keeps them here for exploration.</div>`;return}
if(state.screen==='lists'){root.innerHTML=`<button class="back" data-action="manage">‹ Manage Zone</button><h2 class="panel-title">Block Lists</h2><ul class="outline-list">${Object.entries(lists).map(([k,v])=>`<li><span>${k}<br><small class="subtle">${v}</small></span><button class="link" data-selectlist="${k}">${k===state.list?'Selected':'Use'}</button></li>`).join('')}</ul><p class="caption subtle">This study uses sample rules only. It does not read or block your browser.</p>`;return}
if(state.screen==='schedules'){root.innerHTML=`<button class="back" data-action="manage">‹ Manage Zone</button><h2 class="panel-title">Schedules</h2><ul class="outline-list"><li><span>Morning focus<br><small class="subtle">Weekdays · 9:00–10:00 AM</small></span><label><input type="checkbox" checked aria-label="Enable Morning focus"> On</label></li></ul><p class="caption subtle">A quiet schedule summary. Creation belongs in the main app window.</p>`;return}
if(state.screen==='preferences'){root.innerHTML=`<button class="back" data-action="manage">‹ Manage Zone</button><h2 class="panel-title">Settings</h2><div class="field"><span>Open at login</span><input type="checkbox" checked aria-label="Open at login"></div><div class="field"><span>Website blocking</span><span class="subtle">Browser control</span></div><p class="caption subtle">Safari, Chrome and Dia are connected in this prototype.</p>`;return}
if(state.screen==='review'){root.innerHTML=`<button class="back" data-action="back">‹ Back</button><p class="screen-title" style="margin-top:18px">2 of 2 · Your boundaries</p><div class="review-card"><strong>${state.minutes} minutes</strong><p>Ready to focus</p></div><div class="field"><label for="list">Block list</label>${listPicker()}</div><button class="plain" style="width:100%;padding:12px 0 20px" data-action="options">${summary()} <span style="float:right">›</span></button><button class="primary" data-action="start">Start Focus</button>`;return}
if(state.screen==='confirm'){root.innerHTML=`<div class="confirmation"><button class="back" data-action="back">‹ Back</button><h2>Start a locked session?</h2><p>You won’t be able to end this ${state.minutes}-minute session early. ${state.allowance===0?'No pauses will be available.':`You’ll have ${state.allowance} ${state.allowance===1?'pause':'pauses'} of ${state.pauseMinutes} minutes.`}</p><div class="warning">${state.list} will stay blocked until the session ends, except during a configured pause.</div><button class="primary" data-action="confirm-start">Start Locked Session</button></div>`;return}
if(state.screen==='end'){root.innerHTML=`<div class="confirmation"><button class="back" data-action="back">‹ Keep Focusing</button><h2>End this session?</h2><p>Your websites and apps will become available again.</p><div class="settings-actions"><button class="secondary" data-action="back">Keep Focusing</button><button class="primary" data-action="confirm-end">End Session</button></div></div>`;return}
if(state.phase==='complete'){root.innerHTML=`<div class="completion"><div class="mark" aria-hidden="true">✓</div><h1>Time well spent.</h1><p>Your session is complete.<br>Websites and apps are available again.</p><button class="primary" data-action="reset">Done</button></div>`;return}
root.innerHTML=state.phase==='idle'?interpolate(config.idle):activeHTML();}
function start(){state.phase='active';state.screen='main';state.remaining=state.minutes*60;state.pausesUsed=0;state.startedAt=Date.now();render()}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.duration){state.minutes=Number(target.dataset.duration);render();return}if(target.dataset.recipe){state.recipe=target.dataset.recipe;state.minutes=state.recipe==='deep'?60:25;state.mode=state.recipe==='deep'?'Locked':'Flexible';render();return}if(target.dataset.selectlist){state.list=target.dataset.selectlist;render();return}const a=target.dataset.action;if(!a)return;if(a==='start'){if(state.mode==='Locked'){state.screen='confirm';render()}else start();return}if(a==='confirm-start'){start();return}if(a==='pause'&&state.phase==='active'&&state.pausesUsed<state.allowance){state.phase='paused';state.pausesUsed++;state.pauseRemaining=state.pauseMinutes*60;render();return}if(a==='resume'){state.phase='active';render();return}if(a==='confirm-end'&&state.mode==='Flexible'){state.phase='idle';state.screen='main';render();return}if(a==='reset'){state.phase='idle';state.screen='main';render();return}if(a==='back'){state.screen='main';render();return}if(a==='end'&&state.mode==='Locked')return;state.screen=a;render()});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-minutes]')){state.minutes=Math.max(1,Math.min(1440,Math.round(Number(t.value)||25)));render()}if(t.matches('[data-list]')){state.list=t.value;render()}if(t.dataset.setting){state[t.dataset.setting]=t.dataset.setting==='mode'?t.value:Number(t.value);render()}});
document.addEventListener('input',e=>{if(e.target.matches('input[type=range][data-minutes]')){state.minutes=Number(e.target.value);const ring=document.querySelector('.setup-ring strong');if(ring)ring.textContent=state.minutes;const until=document.querySelector('.until-time strong');if(until)until.textContent=endTime();const fill=document.querySelector('.timeline-fill');if(fill)fill.style.width=(state.minutes/120*100)+'%';const badge=document.querySelector('.badge');if(badge&&state.phase==='idle')badge.textContent=state.minutes+' min';const b=document.querySelector('[data-action=start]');if(b&&config.active==='timeline')b.textContent='Focus Until '+endTime();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.screen!=='main'){state.screen='main';render()}if(e.key==='Enter'&&state.phase==='idle'&&state.screen==='main'&&e.target===document.body){e.preventDefault();if(state.mode==='Locked'){state.screen='confirm';render()}else start()}});
setInterval(()=>{if(state.phase!=='active'&&state.phase!=='paused')return;state.remaining=Math.max(0,state.remaining-1);if(state.phase==='paused'){state.pauseRemaining=Math.max(0,state.pauseRemaining-1);if(state.pauseRemaining===0){state.phase='active';render()}}if(state.remaining===0){state.phase='complete';state.screen='main';render();return}if(state.screen!=='main')return;const counter=document.querySelector('[data-time]');if(counter)counter.textContent=timeString(state.phase==='paused'?state.pauseRemaining:state.remaining);const p=document.querySelector('[data-progress]');if(p)p.style.width=(state.remaining/(state.minutes*60)*100)+'%';const ring=document.querySelector('[data-ring]');if(ring)ring.setAttribute('stroke-dasharray',(state.remaining/(state.minutes*60)*490)+' 490')},1000);render();
</script></body></html>
