<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Zone — Make room for focus.</title>
  <desc id="desc">A small, native macOS app for fewer distractions. A calm green open-ring mark sits beside the Zone wordmark.</desc>
  <defs>
    <linearGradient id="tile" x1="512" y1="64" x2="512" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#294940"/><stop offset="1" stop-color="#162f2a"/>
    </linearGradient>
    <linearGradient id="ring" x1="512" y1="224" x2="512" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#edf7ef"/><stop offset="1" stop-color="#c5e3d5"/>
    </linearGradient>
  </defs>
  <style>
    .surface { fill:#f3f6f0; stroke:#dce5da }
    .title { fill:#263b38 }
    .secondary { fill:#68766d }
    .rule { stroke:#d4dfd1 }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif }
    @media (prefers-color-scheme: dark) {
      .surface { fill:#1b2722; stroke:#33463b }
      .title { fill:#e7eeeb }
      .secondary { fill:#abbdb0 }
      .rule { stroke:#3c5144 }
    }
  </style>
  <rect class="surface" x=".5" y=".5" width="1279" height="399" rx="24"/>
  <text class="secondary" x="72" y="91" font-size="16" font-weight="500" letter-spacing="2">ZONE FOR MAC</text>
  <text class="title" x="68" y="179" font-size="64" font-weight="600" letter-spacing="-2.5">Make room for focus.</text>
  <text class="secondary" x="72" y="231" font-size="23">A small, native app for fewer distractions.</text>
  <path class="rule" d="M72 278H630"/>
  <text class="secondary" x="72" y="317" font-size="16">Your time. Your rules. On your Mac.</text>
  <g transform="translate(882 72) scale(.25)">
    <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
    <rect x="64.5" y="64.5" width="895" height="895" rx="199.5" stroke="#fff" stroke-opacity=".13"/>
    <path d="M747.862849 426.152944A251 251 0 1 1 597.847056 276.137152" stroke="url(#ring)" stroke-width="64" stroke-linecap="round"/>
    <circle cx="512" cy="512" r="48" fill="#9bddc0"/>
  </g>
</svg>
