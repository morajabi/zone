<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Zone app icon</title>
  <desc id="desc">A warm rising sun inside a white open ring, on a dawn sky that fades from periwinkle to apricot.</desc>
  <defs>
    <linearGradient id="sky" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8f9dfb"/>
      <stop offset=".38" stop-color="#d9a4d6"/>
      <stop offset=".72" stop-color="#ffb8a1"/>
      <stop offset="1" stop-color="#ffd59a"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="540" r="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff1d6" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff1d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="482" cy="500" r="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf6"/>
      <stop offset=".55" stop-color="#ffdd94"/>
      <stop offset="1" stop-color="#ffb766"/>
    </radialGradient>
    <filter id="halo" x="300" y="328" width="424" height="424" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <circle cx="512" cy="540" r="360" fill="url(#glow)"/>
    <path d="M726.2499 462.0194A228 228 0 1 1 589.9806 325.7501" stroke="#fff" stroke-opacity=".92" stroke-width="40" stroke-linecap="round"/>
    <circle cx="512" cy="540" r="314" stroke="#fff" stroke-opacity=".24" stroke-width="12"/>
    <circle cx="512" cy="540" r="118" fill="#ffe7b0" fill-opacity=".9" filter="url(#halo)"/>
    <circle cx="512" cy="540" r="118" fill="url(#sun)"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" stroke="#fff" stroke-opacity=".28"/>
</svg>
